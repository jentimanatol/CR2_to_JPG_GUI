name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm CR2_to_JPG.spec

      - name: Verify executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\CR2-to-JPG-Converter.exe")) {
            throw "EXE was not generated."
          }
          Get-Item "dist\CR2-to-JPG-Converter.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CR2-to-JPG-Converter-Windows
          path: dist/CR2-to-JPG-Converter.exe
          if-no-files-found: error
          retention-days: 30
