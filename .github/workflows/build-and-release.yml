name: Build and Release Windows EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm CR2_to_JPG.spec

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "dist\CR2-to-JPG-Converter.exe"
          if (!(Test-Path $exe)) {
            throw "EXE was not generated: $exe"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime,FullName

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CR2-to-JPG-Converter-Windows
          path: dist/CR2-to-JPG-Converter.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CR2-to-JPG-Converter.exe
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
